<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demos Barents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/wi.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" aria-label="widigital"><svg viewBox="0 0 40 28" aria-hidden="true"><path fill="#E73088" d="M0 0h16L8 14z"/><path fill="#F49C24" d="M22 0h16l-8 14z"/><path fill="#00A3B7" d="M11 26h16L19 11z"/></svg><span><b>wi</b>digital</span></a>
  <small>Demos para clientes</small>
</div></header>

<main class="wrap">
  <section class="intro">
    <nav class="crumbs" aria-label="Ruta"><a href="/">Demos</a><span>/</span><span>Barents</span></nav>
    <h1><em>Barents</em></h1>
    <p class="lead">Proyectos de demostración para Barents.</p>
  </section>
  <ul class="list" id="list"></ul>
</main>

<footer class="foot"><div class="wrap"><span>widigital, consultoría tecnológica</span><a href="https://widigital.es">widigital.es</a></div></footer>

<script>
  // Un elemento por subcarpeta. Para añadir un proyecto, añade una entrada aquí.
  const proyectos = [
    { titulo: "Surety Platform", ruta: "/barents/core/", descripcion: "Core de pólizas de caución: de la solicitud a la emisión, con reaseguro, riesgo y solvencia.", tags: ["Submissions", "Underwriting", "Pólizas", "Reaseguro", "ORSA"] },
    { titulo: "Claims", ruta: "/barents/claims/", descripcion: "Gestión de siniestros de punta a punta.", tags: ["Siniestros", "Reservas", "Recobros"] }
  ];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  document.getElementById("list").innerHTML = proyectos.map((p, i) => `
    <li><a href="${esc(p.ruta)}">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <div><h2>${esc(p.titulo)}</h2><p>${esc(p.descripcion)}</p>${p.tags ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}</div>
      <span class="cta">Abrir demo<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a></li>`).join("");
</script>
</body>
</html>
