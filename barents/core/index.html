<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barents Surety Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --muted-bg:#F7F7F8; --hover:#F4F4F5; --ink:#18181B; --muted:#71717A; --soft-ink:#52525B;
  --border:#E4E4E7; --border-strong:#D4D4D8;
  --primary:#C10A27; --primary-hover:#9D0820; --primary-ink:#FFFFFF; --primary-soft:#FDECEE; --primary-line:#F5C2C9;
  --ok:#15803D; --ok-soft:#DCFCE7; --warn:#B45309; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FEE2E2;
  --info:#1D4ED8; --info-soft:#DBEAFE; --purple:#7E22CE; --purple-soft:#F3E8FF; --cyan:#0E7490; --cyan-soft:#CFFAFE; --neutral:#52525B; --neutral-soft:#F1F1F3;
  --shadow:0 1px 2px rgba(0,0,0,.05); --pop:0 20px 50px rgba(0,0,0,.18);
  --head:"Poppins","Roboto","Helvetica Neue",Arial,sans-serif; --body:"Roboto","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --surface:#15181D; --muted-bg:#1B1F25; --hover:#20252C; --ink:#F4F4F5; --muted:#A1A1AA; --soft-ink:#C4C4CC;
    --border:#272B33; --border-strong:#353A44; --primary:#E5304D; --primary-hover:#F04A64; --primary-ink:#FFFFFF; --primary-soft:#3A161D; --primary-line:#6B2532;
    --ok:#4ADE80; --ok-soft:#14301F; --warn:#FBBF24; --warn-soft:#352A12; --bad:#F87171; --bad-soft:#3B1717; --info:#93C5FD; --info-soft:#172A45; --purple:#D8B4FE; --purple-soft:#2E1A40; --cyan:#67E8F9; --cyan-soft:#123138; --neutral:#C4C4CC; --neutral-soft:#262A31;
    --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 20px 50px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#15181D; --muted-bg:#1B1F25; --hover:#20252C; --ink:#F4F4F5; --muted:#A1A1AA; --soft-ink:#C4C4CC;
  --border:#272B33; --border-strong:#353A44; --primary:#E5304D; --primary-hover:#F04A64; --primary-ink:#FFFFFF; --primary-soft:#3A161D; --primary-line:#6B2532;
  --ok:#4ADE80; --ok-soft:#14301F; --warn:#FBBF24; --warn-soft:#352A12; --bad:#F87171; --bad-soft:#3B1717; --info:#93C5FD; --info-soft:#172A45; --purple:#D8B4FE; --purple-soft:#2E1A40; --cyan:#67E8F9; --cyan-soft:#123138; --neutral:#C4C4CC; --neutral-soft:#262A31;
  --shadow:0 1px 2px rgba(0,0,0,.4); --pop:0 20px 50px rgba(0,0,0,.6);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}

/* Shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface);min-height:0}
.logo{display:flex;align-items:center;gap:12px;padding:14px 24px;height:64px}
.logo-mark{width:36px;height:36px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff}
.logo-mark svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.logo b{display:block;font:700 15px/1.1 var(--head);letter-spacing:.06em}
.logo small{display:block;font-size:11px;color:var(--muted)}
.new-sub{margin:12px 12px 8px;display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink);border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;text-decoration:none}
.new-sub:hover{background:var(--primary-hover)}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:var(--soft-ink);text-decoration:none;font-weight:500;margin:2px 0}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--primary);color:var(--primary-ink)}
.grp{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:14px 12px 6px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.grp svg{width:14px;height:14px;transition:transform .15s}
.grp[aria-expanded="false"] svg{transform:rotate(-90deg)}
.grp-items[hidden]{display:none}
.me{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);padding:12px 16px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.me b{display:block;font-weight:500;font-size:14px;line-height:1.2}
.me small{display:block;color:var(--muted);font-size:12px}
.me .grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:64px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 16px;background:var(--surface);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:500}
.search{display:flex;align-items:center;gap:10px;width:min(384px,36vw);height:40px;border:1px solid var(--border);border-radius:8px;padding:0 6px 0 14px;color:var(--muted);background:var(--surface)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
kbd{font:500 11px/1 var(--body);background:var(--muted-bg);border:1px solid var(--border);border-radius:5px;padding:4px 6px;color:var(--muted)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--soft-ink);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.lang{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-weight:500;font-size:13px}
.lang small{font-size:10px;color:var(--muted)}
.main{flex:1;overflow:auto;padding:28px 24px 48px}
.page{max-width:1400px;margin:0 auto}
.banner{margin:0 0 18px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}

/* Headings, buttons, inputs */
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font:600 24px/1.25 var(--head);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap;line-height:1.4}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.primary[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary[disabled]:hover{background:var(--primary)}
.btn.ghost{border-color:transparent;background:none;color:var(--soft-ink)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.icon{padding:7px;border-color:transparent;background:none;color:var(--muted)}
.btn.icon:hover{color:var(--ink);background:var(--hover)}
.select,.field input,.field select,.field textarea{height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
.field textarea{height:auto;padding:8px 12px;min-height:72px}
.select{width:auto;min-width:216px;padding-right:32px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:500;color:var(--soft-ink)}
.err{color:var(--bad);font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:0}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}

/* Tables and cards */
.tbl{border:1px solid var(--border);border-radius:12px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:500;color:var(--soft-ink);background:var(--muted-bg);padding:12px 16px;white-space:nowrap}
td{padding:14px 16px;border-top:1px solid var(--border);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.pno{color:var(--primary);font-weight:500;text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.pno.draft{color:var(--muted);font-style:italic;font-weight:400}
.strong{font-weight:600}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.sub{display:block;color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11.5px;font-weight:500;line-height:1.5;white-space:nowrap}
.b-draft,.b-pending,.b-issued{background:var(--neutral-soft);color:var(--neutral)}
.b-active,.b-paid{background:var(--ok-soft);color:var(--ok)}
.b-expired,.b-partial{background:var(--warn-soft);color:var(--warn)}
.b-cancelled,.b-overdue{background:var(--bad-soft);color:var(--bad)}
.b-released,.b-refund{background:var(--info-soft);color:var(--info)}
.card{border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:20px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
.card-h h2{display:flex;align-items:center;gap:10px;font:600 14.5px/1.3 var(--body);margin:0}
.card-b{padding:20px}
.none{padding:36px 0;text-align:center;color:var(--muted)}
.inline-form{border:1px solid var(--border);border-radius:10px;background:var(--muted-bg);padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.delta{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 14px;padding:10px 14px;border:1px solid var(--primary-line);background:var(--primary-soft);border-radius:8px}
.delta span{color:var(--soft-ink)}
.delta b{color:var(--ink);font-variant-numeric:tabular-nums}
.totals{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:12px;color:var(--muted)}
.totals b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Policy document */
.doc-title{text-align:center;padding:22px 20px 16px;border-bottom:1px solid var(--border)}
.doc-title h2{font:600 17px/1.3 var(--body);margin:0;text-transform:uppercase;letter-spacing:.01em}
.doc-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
.doc-title .badge{margin-bottom:6px}
.drow{display:grid;grid-template-columns:240px minmax(0,1fr);border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:0}
.drow>div:first-child{padding:14px 20px;font-size:11.5px;font-weight:500;color:var(--soft-ink);text-transform:uppercase;letter-spacing:.03em;background:var(--muted-bg)}
.drow>div:last-child{padding:14px 20px}
.drow .v{font-weight:500}
.drow .m{color:var(--muted);font-size:12px}
.drow .big{font:600 20px/1.3 var(--body);font-variant-numeric:tabular-nums}
.money{display:grid;grid-template-columns:max-content max-content;gap:4px 28px;font-variant-numeric:tabular-nums}
.money .t{font-weight:700;padding-top:6px;border-top:1px solid var(--border)}

/* New policy form */
.sec{padding:20px 0;border-bottom:1px solid var(--border)}
.sec:first-child{padding-top:0}
.sec-h{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:16px}
.tile{width:30px;height:30px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.computed{border:1px solid var(--primary-line);background:var(--primary-soft);border-radius:10px;padding:14px 16px;margin-top:16px}
.computed .ttl{display:flex;align-items:center;gap:8px;color:var(--primary);font-weight:500;font-size:13px;margin-bottom:10px}
.computed .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.computed .cols span{display:block;color:var(--soft-ink);font-size:12.5px}
.computed .cols b{display:block;font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.computed .cols .tot b{color:var(--primary)}
.form-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-top:20px}

/* Dialog, toast */
dialog{border:0;border-radius:12px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--pop)}
dialog::backdrop{background:rgba(9,9,11,.5)}
dialog.wide{width:min(720px,calc(100vw - 32px))}
.dlg{padding:22px 24px}
.dlg h2{font:600 18px/1.3 var(--head);margin:0 0 4px}
.dlg .grid{margin-top:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.paper{border:1px solid var(--border);border-radius:8px;background:#fff;color:#18181B;padding:28px;max-height:60vh;overflow:auto}
.soon{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.soon h1{justify-content:center;color:var(--ink);margin-bottom:8px}
#toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 40px)}
#toast.show{opacity:1;transform:none}


/* Charts and docs */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:140px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:13px}
.bar-l{color:var(--soft-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{height:12px;background:var(--muted-bg);border-radius:6px;overflow:hidden}
.bar-f{display:block;height:100%;background:var(--primary);border-radius:6px}
.bar-v{text-align:right}
.cols-chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:180px;align-items:end}
.col-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.col-f{width:100%;max-width:34px;background:var(--primary);border-radius:4px 4px 0 0;opacity:.85}
.col-v{font-size:10px;color:var(--muted);white-space:nowrap}
.col-l{font-size:11px;color:var(--muted)}
a.kpi:hover{border-color:var(--border-strong);background:var(--hover)}
.flist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.flist li{line-height:1.5}
/* Status banner, connections */
.status-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;border-radius:10px;margin-bottom:20px;text-decoration:none;border:1px solid}
.st-red{background:var(--bad-soft);color:var(--bad);border-color:transparent}.st-yellow{background:var(--warn-soft);color:var(--warn);border-color:transparent}.st-green{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.conn-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-decoration:none;color:inherit}
.conn-item:hover{background:var(--hover)}.conn-item.on{background:var(--primary-soft)}
.conn-item b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conn-item small{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:1200px){.conn-grid{grid-template-columns:minmax(0,1fr)!important}}
/* Submissions */
.b-submitted{background:var(--info-soft);color:var(--info)}
.b-under_analysis,.b-returned{background:var(--warn-soft);color:var(--warn)}
.b-underwriting{background:var(--purple-soft);color:var(--purple)}
.b-referred{background:#FFEDD5;color:#C2410C}
.b-offer_created,.b-issued_offer{background:var(--cyan-soft);color:var(--cyan)}
.b-accepted,.b-policy_issued{background:var(--ok-soft);color:var(--ok)}
.b-rejected,.b-declined{background:var(--bad-soft);color:var(--bad)}
.b-closed{background:var(--neutral-soft);color:var(--neutral)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;color:var(--soft-ink);font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button:hover{color:var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 20px;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;background:var(--neutral-soft);color:var(--muted)}
.step.done i{background:var(--ok-soft);color:var(--ok)}
.step.cur{color:var(--ink);font-weight:500}.step.cur i{background:var(--primary);color:#fff}
.step.alt.cur i{background:var(--warn);color:#fff}
.step-sep{width:18px;height:1px;background:var(--border-strong)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.dl{display:grid;grid-template-columns:190px minmax(0,1fr);gap:10px 16px;margin:0}
.dl dt{color:var(--soft-ink)}.dl dd{margin:0}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl-row .btn.link{font-size:12.5px;color:var(--primary);text-decoration:none;font-weight:500;border:0;background:none;padding:0;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi span{display:block;color:var(--soft-ink);font-size:12.5px}
.kpi b{display:block;font-size:18px;margin-top:2px;font-variant-numeric:tabular-nums}
.verdict{border-radius:10px;padding:12px 14px;border:1px solid}
.verdict.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.verdict.ref{background:#FFF7ED;border-color:#FED7AA;color:#C2410C}
.verdict ul{margin:6px 0 0;padding-left:18px}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font:600 30px/1 var(--head);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.offer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.offer span{color:var(--soft-ink)}.offer b{color:var(--ink)}
.offer .grow{flex:1}
.offer-terms{flex-basis:100%;color:var(--muted);font-size:13px}
.doclist{list-style:none;margin:0;padding:0}
.doclist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.doclist li:last-child{border-bottom:0}
.doclist a{color:var(--primary);text-decoration:none;font-weight:500}
.linkline{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-weight:500}
.kindtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:1fr 1fr}.computed .cols{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.drow{grid-template-columns:170px minmax(0,1fr)}}
@media (max-width:820px){

/* ---------- Catalogues ---------- */
const GTYPES={bid:"Bid Bond",performance:"Performance",advance:"Advance Payment",warranty:"Warranty",customs:"Customs"};

  {items:[["Dashboard","grid","#/dashboard"],["Board Pack","board","#/board"]]},

];

/* ---------- Utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmt0=new Intl.NumberFormat("en-GB",{maximumFractionDigits:0}), fmt2=new Intl.NumberFormat("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=n=>{n=r2(n);const neg=n<0,a=Math.abs(n);return (neg?"-":"")+"€"+(Number.isInteger(a)?fmt0.format(a):fmt2.format(a))};
const signed=n=>(n>0?"+":"")+eur(n);
const pct=n=>(+n||0).toLocaleString("en-GB",{maximumFractionDigits:3})+"%";
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(iso){if(!iso)return "";const [y,m,d]=iso.slice(0,10).split("-");return +d+"."+m+"."+y}
function fstamp(iso){const d=new Date(iso);return fdate(iso.slice(0,10)===iso?iso:d.toISOString().slice(0,10))+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
function addMonths(iso,n){const [y,m,d]=iso.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}
function addDays(iso,n){const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function days(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000)}
function monthsBetween(a,b){const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);let m=(y2-y1)*12+(m2-m1);if(d2<d1)m-=1;return Math.max(0,m)}

/* ---------- State ---------- */
const store={mode:"loading",db:null,user:null,downloads:null,me:null,canWrite:true,parties:[],policies:[],submissions:[],complaints:[],rules:[],links:[],treaties:[],placements:[],statements:[],runs:[],assumptions:[],ifrs:[],risks:[],kris:[],appetite:[],assets:null,settings:{taxes:{...DEFAULT_TAX},issue_place:""},names:{},loaded:{parties:false,policies:false,submissions:false,complaints:false,rules:false,links:false,treaties:false,placements:false,statements:false,runs:false,assumptions:false,ifrs:false,risks:false,kris:false,appetite:false}};

/* ---------- Persistence ---------- */
const queues={};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3200)}
function writeErr(e){const c=e&&e.code;
  if(c==="invalid_argument"){store.canWrite=false;toast("You don't have permission to change data on this page.");render()}
  else if(c==="quota_exceeded")toast("The database is full. Delete old records before creating new ones.");
  else if(c==="revoked"){store.canWrite=false;render()}
  else toast("Couldn't save. Try again.")}
function savePolicy(p){
  const body=clone(p),id=body.id;delete body.id;
  if(store.mode!=="db"){const i=store.policies.findIndex(x=>x.id===id);const v={id,...body};if(i>=0)store.policies[i]=v;else store.policies.push(v);render();return Promise.resolve()}
  const run=()=>store.db.doc("policies/"+id).set(body).catch(e=>{if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(()=>store.db.doc("policies/"+id).set(body));throw e});
  const next=(queues[id]||Promise.resolve()).catch(()=>{}).then(run);queues[id]=next;next.catch(writeErr);return next;
}
function saveSettings(s){store.settings={...store.settings,...s};if(store.mode!=="db"){render();return Promise.resolve()}return store.db.doc("settings/general").set(clone(store.settings)).catch(writeErr)}

/* ---------- Deferred render while typing ---------- */

/* ---------- Routing ---------- */
function route(){const h=decodeURIComponent(location.hash.replace(/^#\/?/,"")).split("/");
  if(h[0]==="policies"&&h[1]==="new")return{v:"new"};if(h[0]==="policies"&&h[1])return{v:"detail",id:h[1]};
  if(h[0]==="submissions"&&h[1]==="new")return{v:"subnew"};if(h[0]==="submissions"&&h[1]&&h[2]==="edit")return{v:"subedit",id:h[1]};if(h[0]==="submissions"&&h[1])return{v:"sub",id:h[1]};if(h[0]==="submissions")return{v:"subs"};
  const simple={dashboard:1,renewals:1,claims:1,complaints:1,rules:1,settings:1,audit:1,docs:1,board:1,connections:1,reinsurance:1,commissions:1,reports:1,actuarial:1,orsa:1,risk:1};if(simple[h[0]])return{v:h[0]};if(!h[0])return{v:"dashboard"};
  if(h[0]==="offers")return{v:"offers"};if(h[0]==="cuo")return{v:"cuo"};if(h[0]==="clients")return{v:"clients"};
  if(h[0]==="soon")return{v:"soon",name:h[1]||"Module"};return{v:"list"}}

function renderNav(){
  const r=route(); const cur=r.v==="soon"?r.name:{subs:"Submissions",subnew:"Submissions",subedit:"Submissions",sub:"Submissions",offers:"Offers",cuo:"CUO Referrals",clients:"Clients",dashboard:"Dashboard",renewals:"Renewals",claims:"Claims",complaints:"Complaints",rules:"Underwriting Rules",settings:"Settings",audit:"Audit Log",docs:"Functional Map",board:"Board Pack",connections:"Connections",reinsurance:"Reinsurance",commissions:"Commissions",reports:"Reports",actuarial:"Actuarial",orsa:"ORSA",risk:"Risk Governance"}[r.v]||"Policies";
  $("#nav").innerHTML=NAV.map((g,gi)=>{
    const items=g.items.map(([n,i,href])=>`<a href="${href||"#/soon/"+encodeURIComponent(n)}" class="${cur===n?"on":""}">${ic(i)}${esc(n)}</a>`).join("");
    if(!g.g)return items;
    const open=!ui.collapsed[gi];
    return `<button class="grp" aria-expanded="${open}" data-action="grp" data-arg="${gi}">${esc(g.g)}${ic("chev")}</button><div class="grp-items"${open?"":" hidden"}>${items}</div>`;
  }).join("");
  const crumb=esc(cur);
  $("#crumbs").innerHTML=`<span>Surety Platform</span>${ic("chevR","sm")}<b>${crumb}</b>`;
}

function render(){
  if(typeof _memo!=="undefined")for(const k in _memo)delete _memo[k];
  renderNav();
  const r=route(),m=$("#main");let html="";
  if(store.mode==="local")html+=`<p class="banner">No database connection. Changes only last while this tab stays open.</p>`;
  else if(store.mode==="db"&&!store.canWrite)html+=`<p class="banner">You have read-only access to this page.</p>`;
  if(r.v==="soon"){m.innerHTML=html+`<div class="soon"><h1>${esc(r.name)}</h1><p>This module isn't built yet. Policies is the first one available.</p><a class="btn" href="#/policies">Go to Policies</a></div>`;return}
  if(store.mode==="loading"||(store.mode==="db"&&!Object.values(store.loaded).every(Boolean))){m.innerHTML=html+`<p class="hint">Loading policies...</p>`;return}
  if(r.v==="new")html+=viewNew();else if(r.v==="detail")html+=viewDetail(r.id);
  else if(r.v==="subs")html+=viewSubList();else if(r.v==="subnew")html+=viewSubForm(null);else if(r.v==="subedit")html+=viewSubForm(r.id);else if(r.v==="sub")html+=viewSubDetail(r.id);
  else if(r.v==="dashboard")html+=viewDashboard();else if(r.v==="renewals")html+=viewRenewals();else if(r.v==="claims")html+=viewClaims();else if(r.v==="complaints")html+=viewComplaints();
  else if(r.v==="rules")html+=viewRules();else if(r.v==="settings")html+=viewSettings();else if(r.v==="audit")html+=viewAudit();else if(r.v==="docs")html+=viewDocs();
  else if(r.v==="board")html+=viewBoard();else if(r.v==="connections")html+=viewConnections();else if(r.v==="reinsurance")html+=viewReinsurance();else if(r.v==="commissions")html+=viewCommissions();
  else if(r.v==="reports")html+=viewReports();else if(r.v==="actuarial")html+=viewActuarial();else if(r.v==="orsa")html+=viewOrsa();else if(r.v==="risk")html+=viewRisk();
  else if(r.v==="offers")html+=viewOffers();else if(r.v==="cuo")html+=viewCuo();else if(r.v==="clients")html+=viewClients();else html+=viewList();
  m.innerHTML=html;
  if(r.v==="detail"||r.v==="sub")resolveNames();
}

/* ---------- List ---------- */
function viewList(){
  const f=ui.filters,q=f.q.trim().toLowerCase();
  const all=[...store.policies].sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));

/* Endorsements */
function endoCalc(p,e){
  const err={},type=e.type,eff=type==="void"?p.effective_date:e.effective_date,oldSum=+p.insured_amount,oldExp=p.expiry_date;let newSum=oldSum,newExp=oldExp;
  if(type==="sum"||type==="term_sum"){newSum=+e.new_amount;if(!(newSum>0))err.new_amount="Enter the new insured amount.";else if(type==="sum"&&newSum===oldSum)err.new_amount="Same as the current amount."}
  if(type==="term"||type==="term_sum"){newExp=e.new_expiry;if(!newExp)err.new_expiry="Enter the new expiry date.";else if(newExp<=eff)err.new_expiry="Must be after the effective date.";else if(type==="term"&&newExp===oldExp)err.new_expiry="Same as the current expiry."}
  if(type!=="void"){if(!eff)err.effective_date="Enter the effective date.";else if(eff<p.effective_date||eff>oldExp)err.effective_date="Must be between "+fdate(p.effective_date)+" and "+fdate(oldExp)+"."}
  const base=Math.max(1,days(p.effective_date,p.original_expiry||p.expiry_date));const P=(sum,from,to)=>sum*(+p.rate_pct/100)*Math.max(0,days(from,to))/base;
  let dp=0;if(!Object.keys(err).length){if(type==="void")dp=-p.premium;else if(type==="cancellation")dp=-P(oldSum,eff,oldExp);else if(type!=="other")dp=P(newSum,eff,newExp)-P(oldSum,eff,oldExp)}
  dp=r2(dp);const dt=r2(dp*(+p.tax_pct)/100);return{err,eff,newSum,newExp,dp,dt,total:r2(dp+dt)};
}

function schedule(p,freq){const step=FREQ[freq][1],dates=[p.effective_date];
  if(step){let k=1,d=addMonths(p.effective_date,step);while(d<p.expiry_date){dates.push(d);k++;d=addMonths(p.effective_date,step*k)}}
  const n=dates.length,base=Math.floor(p.total_due/n*100)/100;
  return dates.map((d,i)=>({id:uid(),n:i+1,due_date:d,amount:i===n-1?r2(p.total_due-base*(n-1)):base,paid_amount:0,paid_date:null,kind:"premium",ref:null}))}

/* Risk scoring: 9 weighted components, factors 1 (best) to 10 (worst) */
const bandHigh=(v,list)=>{for(const [t,f] of list)if(v>=t)return f;return 10};
const bandLow=(v,list)=>{for(const [t,f] of list)if(v<=t)return f;return 10};
const TERM_B=[[6,1],[12,2],[18,4],[24,5],[36,6],[60,8]];
const LIQ_B=[[200,1],[150,2],[120,4],[100,6],[80,8]];
const MARGIN_B=[[20,2],[15,4],[10,6],[5,8]];
const EQR_B=[[60,1],[50,2],[40,4],[30,6],[20,8]];
const COV_B=[[5,2],[10,4],[15,6],[20,8]];
function risk(sub){
  const A=sub.analysis||{},n=k=>(A[k]===""||A[k]==null||isNaN(+A[k]))?null:+A[k];
  const eq=n("equity"),ta=n("assets"),tl=n("liabilities"),rev=n("revenue"),eb=n("ebitda"),ca=n("ca"),cl=n("cl"),amt=+sub.amount||0,term=+sub.period_months||0;
  const r={eqRatio:eq!=null&&ta?eq/ta*100:null,de:tl!=null&&eq?tl/eq:null,margin:eb!=null&&rev?eb/rev*100:null,liq:ca!=null&&cl?ca/cl*100:null,covCap:eq?amt/eq*100:null,covEb:eb?amt/eb*100:null};
  const c=(g,label,w,f,note)=>({g,label,w,f,note,x:f*w});
  const comps=[
    c("Term","Company history",.0525,A.history?HIST_F[A.history]:10,A.history?"":"not set"),
    c("Term","Bond term",.0975,bandLow(term,TERM_B),term+" m"),
    c("Financial risk","Current liquidity",.14,r.liq==null?10:bandHigh(r.liq,LIQ_B),pc(r.liq)),
    c("Financial risk","Profitability",.14,r.margin==null?10:bandHigh(r.margin,MARGIN_B),pc(r.margin)),
    c("Financial risk","Indebtedness",.12,r.eqRatio==null?10:bandHigh(r.eqRatio,EQR_B),pc(r.eqRatio)),
    c("Risk coverage","Coverage by capital",.15,r.covCap==null?10:bandLow(r.covCap,COV_B),pc(r.covCap)),
    c("Risk coverage","Coverage by EBITDA",.15,r.covEb==null?10:bandLow(r.covEb,COV_B),pc(r.covEb)),
    c("Capacity","Experience in activity",.075,A.experience?EXPER_F[A.experience]:10,A.experience?"":"not set"),
    c("Capacity","Free capacity",.075,A.capacity?CAPAC_F[A.capacity]:10,A.capacity?"":"not set")];
  const base=comps.reduce((t,x)=>t+x.x,0);const adds=[];
  if(+A.fin_det)adds.push(["Financial ratios deterioration",+A.fin_det]);if(+A.cov_det)adds.push(["Risk coverage deterioration",+A.cov_det]);
  if(A.neg_info)adds.push(["Negative owner / manager info",1]);if(A.legal)adds.push(["Legal proceedings against company",2]);
  const final=base+adds.reduce((t,a)=>t+a[1],0);
  const cls=final<=3?"Excellent":final<=4.5?"Good":final<=6?"Acceptable":final<=7.5?"Weak":"Unacceptable";
  const complete=[eq,ta,tl,rev,eb,ca,cl].every(v=>v!=null)&&!!A.history&&!!A.experience&&!!A.capacity;
  const baseT=tariffs()[sub.guarantee_type]??1,add=CLASS_ADD[cls];
  return{r,comps,base,adds,final,cls,complete,baseT,add,suggested:add==null?null:r2(baseT+add)};
}
const clsBadge=c=>`<span class="badge ${c==="Excellent"||c==="Good"?"b-active":c==="Acceptable"?"b-submitted":c==="Weak"?"b-expired":"b-cancelled"}">${c}</span>`;
function exposure(clientId,exSub){
  const pols=store.policies.filter(p=>p.client_id===clientId&&effStatus(p)==="active");const by={};
  pols.forEach(p=>by[p.guarantee_type]=(by[p.guarantee_type]||0)+(+p.insured_amount||0));
  const open=store.submissions.filter(s=>s.client_id===clientId&&s.id!==exSub).flatMap(s=>s.offers||[]).filter(o=>offerStatus(o)==="issued"||offerStatus(o)==="draft");
  return{total:pols.reduce((t,p)=>t+(+p.insured_amount||0),0),count:pols.length,by,openOffers:open.length,openAmount:0};
}
function verdict(sub){
  const ex=exposure(sub.client_id,sub.id),R=risk(sub),reasons=evalRules(sub).map(r=>r.name+(r.description?": "+r.description:"")+" ("+ruleText(r)+")");
  if(!R.complete)reasons.push("The financial analysis is incomplete.");
  const approved=sub.cuo&&sub.cuo.decision==="approved";
  return{reasons,needs:reasons.length>0&&!approved,approved,R,ex};
}

function subSave(){

}

function offerCreate(id){

function ruleText(r){const c=r.cond||{},b=[];if(c.country)b.push("Country = "+c.country);if(c.gtype)b.push(GTYPES[c.gtype]);if(c.amount_gte)b.push("Amount ≥ "+eur(c.amount_gte));if(c.client_exp_gte)b.push("Client exposure ≥ "+eur(c.client_exp_gte));if(c.score_gte)b.push("Risk score ≥ "+c.score_gte);if(c.group_exp_gte)b.push("Connected group exposure ≥ "+eur(c.group_exp_gte));return b.join(", ")||"No conditions"}
function evalRules(sub){
  const ex=exposure(sub.client_id,sub.id),R=risk(sub);
  return store.rules.filter(r=>r.active).sort((a,b)=>a.priority-b.priority).filter(r=>{const c=r.cond||{};
    if(!(c.country||c.gtype||c.amount_gte||c.client_exp_gte||c.score_gte||c.group_exp_gte))return false;
    if(c.group_exp_gte&&!(groupExp(sub.client_id)>=c.group_exp_gte))return false;
    if(c.country&&sub.country!==c.country)return false;if(c.gtype&&sub.guarantee_type!==c.gtype)return false;
    if(c.amount_gte&&!(+sub.amount>=c.amount_gte))return false;if(c.client_exp_gte&&!(ex.total>=c.client_exp_gte))return false;
    if(c.score_gte&&!(R.complete&&R.final>=c.score_gte))return false;return true});
}

function groupOf(cid){
  const c=party(cid),seen=new Set([cid]),q=[cid],viaLink=new Set();
  while(q.length){const x=q.shift();store.links.forEach(l=>{const o=l.a===x?l.b:l.b===x?l.a:null;if(o&&!seen.has(o)){seen.add(o);viaLink.add(o);q.push(o)}})}
  const named=c&&c.group?byKind("client").filter(p=>p.group===c.group).map(p=>p.id):[cid];
  named.forEach(id=>{if(!seen.has(id)){seen.add(id)}viaLink.delete(id)});
  return{members:[...seen],named,hidden:[...viaLink]};
}

const TSTRUCT={quota_share:"Quota-share",surplus:"Surplus",xol:"Excess-of-loss"};
const PTYPE={fronting:"Fronting",facultative:"Facultative",treaty:"Treaty"};
const PST={quoted:"Quoted",bound:"Bound",declined:"Declined"};
function cessionOf(p){
  const pl=store.placements.filter(x=>x.policy_id===p.id&&x.status==="bound");
  if(pl.length)return Math.min(1,sumF(pl,x=>x.ceded)/(+p.insured_amount||1));
  const d=p.issue_date||p.effective_date,qs=store.treaties.find(t=>t.structure==="quota_share"&&t.start<=d&&t.end>=d);

function assumpFor(asAt){return [...store.assumptions].filter(a=>a.status==="approved"&&a.effective_from<=asAt).sort((a,b)=>b.version-a.version)[0]||{version:0,...DEFAULT_ASSUMP}}

/* ---- Solvency engine (simplified standard-formula approximation) ---- */
function solv(sh){return memo('solv:'+JSON.stringify(sh||{}),()=>solv_(sh||{}))}
function solv_(sh){
  const of=ownFunds()*(sh.of||1)-(sh.callLoss||0),t=todayISO(),y1=addDays(t,-365);
  const iss=store.policies.filter(p=>p.number&&!p.voided&&(p.issue_date||"")>=y1),gp=sumF(iss,p=>p.premium)*(sh.prem||1),np=sumF(iss,p=>p.premium*(1-cessionOf(p)))*(sh.prem||1);
  const run=latestRun(),c=run?computeRun(t):computeRun(t);
  const nres=(sh.reinsFail?c.gross:c.net)*(sh.prov||1);
  const premRes=3*0.19*(np+nres);
  const grp=groupsRanking().map(g=>sumF(g.members.flatMap(id=>activePols().filter(p=>p.client_id===id)),p=>p.insured_amount*(sh.reinsFail?1:1-cessionOf(p))));
  const largeDefault=0.1*((grp[0]||0)+(grp[1]||0)),recession=1.0*np,cat=Math.max(largeDefault,recession)*(sh.cat||1);
  const recov=sh.reinsFail?0:sumF(allClaims(),({p,c})=>recoverable(p,c))+(c.gross-c.net);
  const cpd=0.06*recov,bscr=Math.sqrt(premRes**2+cat**2+2*0.25*premRes*cat+cpd**2),op=0.03*gp,scr=bscr+op;
  const mcr=Math.max(Math.min(Math.max(0.25*scr,0),0.45*scr),2700000);
  return{of,scr,mcr,cov:scr?of/scr*100:999,mcrCov:mcr?of/mcr*100:999,premRes,cat,cpd,op,np,gp,nres};
}
const SCEN=[["Base",{}],["Claims shock (+50% provisions)",{prov:1.5}],["Premium decline (−30%)",{prem:0.7}],["Market shock (−15% own funds)",{of:0.85}],["Catastrophic guarantee call",{callLoss:0.05,prov:1.2,cat:1.2}],["Reinsurer failure (recoverables lost)",{reinsFail:true}],["Combined adverse",{of:0.9,prov:1.3,prem:0.85}]];
const solvStatus=c=>c<100?"red":c<150?"yellow":"green";
function scenarios(){const base=solv();return SCEN.map(([n,s])=>{const sh={...s};if(sh.callLoss)sh.callLoss=sh.callLoss*ownFunds();const r=solv(sh);return{n,r,d:r.cov-base.cov}})}
function reverse(){const b=solv();const ofLoss=b.scr?Math.max(0,(b.of-b.scr)/b.of*100):100;let k=null;for(let m=1;m<=20;m+=0.1){if(solv({prov:m}).cov<100){k=Math.round(m*10)/10;break}}return{ofLoss,k,base:b}}
function projection(kind){const P={base:[0.05,0.25],adverse:[0,0.5],severe:[-0.15,0.9]}[kind],b=solv(),y=new Date().getFullYear();let of=b.of,prem=b.gp||0;const rows=[];
  for(let n=0;n<=3;n++){if(n){prem=prem*(1+P[0]);of=of+prem*(1-P[1]-0.3)}const scale=b.gp?prem/b.gp:1,scr=b.scr*(0.5+0.5*scale),mcr=Math.max(0.25*scr,2700000);rows.push([y+n,of,prem,scr,of/scr*100,of/mcr*100])}return rows}
function viewOrsa(){
  const rv=reverse(),sc=scenarios(),pr=k=>projection(k);
  return `<div class="ph"><div><h1>ORSA</h1><p>Own risk and solvency assessment: stress, projection and reverse stress through a single solvency engine.</p></div><div class="btns"><button class="btn" data-action="orsa-csv" data-arg="stress">${ic("download")}Stress (CSV)</button><button class="btn" data-action="orsa-csv" data-arg="proj">${ic("download")}Projection (CSV)</button></div></div>
  <div class="kpis" style="margin-bottom:20px"><div class="kpi"><span>Base SCR coverage</span><b style="color:${rv.base.cov<100?"var(--bad)":"inherit"}">${Math.round(rv.base.cov*10)/10}%</b></div><div class="kpi"><span>Own-funds loss to breach 100%</span><b>${rv.base.cov<100?"Already breached":"−"+Math.round(rv.ofLoss*10)/10+"%"}</b></div><div class="kpi"><span>Claims shock to breach 100%</span><b>${rv.base.cov<100?"Already breached":rv.k?"×"+rv.k:"Above ×20"}</b></div></div>
  <section class="card"><div class="card-h"><h2>Stress scenarios</h2></div><div class="card-b"><p class="hint" style="margin-bottom:12px">Every scenario re-runs the solvency formula with shocked inputs, never adders on a base result.</p>${T(["Scenario",">Own funds",">Net SCR",">SCR coverage",">Δ coverage","Status"],sc.map(s=>[esc(s.n),eur(s.r.of),eur(s.r.scr),Math.round(s.r.cov*10)/10+"%",s.n==="Base"?"–":(s.d>0?"+":"")+Math.round(s.d*10)/10+" pts",rag(solvStatus(s.r.cov))]))}</div></section>
  ${["base","adverse","severe"].map(k=>`<section class="card"><div class="card-h"><h2>Multi-year projection: ${k[0].toUpperCase()+k.slice(1)}</h2><span class="hint">${{base:"Premium +5% a year, loss ratio 25%",adverse:"Flat premium, loss ratio 50%",severe:"Premium −15% a year, loss ratio 90%"}[k]}, expenses 30%</span></div><div class="card-b">${T(["Year",">Own funds",">Written premium",">SCR",">SCR coverage",">MCR coverage"],pr(k).map(r=>[r[0],eur(r[1]),eur(r[2]),eur(r[3]),Math.round(r[4]*10)/10+"%",Math.round(r[5]*10)/10+"%"]))}</div></section>`).join("")}
  <section class="card"><div class="card-h"><h2>SCR composition (base)</h2></div><div class="card-b">${T(["Module",">Amount"],[["Premium and reserve risk (3 × 19% × net volume)",eur(rv.base.premRes)],["Credit and suretyship catastrophe (max of large default and recession)",eur(rv.base.cat)],["Counterparty default on reinsurance (6% of recoverables)",eur(rv.base.cpd)],["Operational risk (3% of gross premium)",eur(rv.base.op)],["<b>Net SCR</b>","<b>"+eur(rv.base.scr)+"</b>"],["MCR",eur(rv.base.mcr)],["Own funds",eur(rv.base.of)]])}<p class="hint" style="margin-top:10px">Simplified approximation of the Solvency II standard formula. Factors are assumptions to validate with the actuarial function.</p></div></section>`;
}

const RCAT=["Underwriting","Credit","Market","Operational","Liquidity","Strategic","Compliance"];

const rLabel=v=>v>=15?["Critical","b-cancelled"]:v>=8?["High","b-referred"]:v>=4?["Medium","b-expired"]:["Low","b-active"];
const KRI_SRC={scr_coverage_pct:"SCR coverage (net) %",overdue_premium_pct:"Overdue premium %",top_exposure_concentration_pct:"Top group concentration %",complaints_overdue:"Overdue complaints",loss_ratio_pct:"Loss ratio %"};
function kriValue(src){
  if(src==="scr_coverage_pct")return r2(solv().cov);
  if(src==="overdue_premium_pct"){const t=todayISO();let out=0,over=0;store.policies.filter(p=>p.number).forEach(p=>(p.installments||[]).forEach(i=>{if(i.amount>0){const o=Math.max(0,i.amount-(+i.paid_amount||0));out+=o;if(i.due_date<t)over+=o}}));return out?r2(over/out*100):0}
  if(src==="top_exposure_concentration_pct"){const g=groupsRanking(),tot=sumF(activePols(),p=>p.insured_amount);return tot&&g[0]?r2(g[0].exp/tot*100):0}
  if(src==="complaints_overdue"){const t=todayISO();return store.complaints.filter(c=>cmpOpen(c)&&c.deadline<t).length}
  if(src==="loss_ratio_pct"){const wp=sumF(store.policies.filter(p=>p.number),p=>p.premium),inc=sumF(allClaims(),({c})=>(+c.paid||0)+(+c.reserve||0));return wp?r2(inc/wp*100):0}
  return 0;
}
function thrStatus(v,dir,a,b){return dir==="low_bad"?(v<b?"red":v<a?"yellow":"green"):(v>b?"red":v>a?"yellow":"green")}
function appetiteRows(){return store.appetite.map(a=>{const v=kriValue(a.source);return{a,v,st:thrStatus(v,a.direction,a.tolerance,a.limit)}})}

  else if(tab==="kri")body=`<div class="btns" style="justify-content:space-between;margin-bottom:12px"><p class="hint">Values are computed live from the platform. Record a snapshot to build the history behind each trend.</p>${w?`<button class="btn" data-action="kri-snap">Record today's values</button>`:""}</div>`+T(["Name",">Value","Thresholds","Direction","Trend","Source","Status"],store.kris.map(k=>{const v=kriValue(k.source),st=thrStatus(v,k.direction,k.warn,k.breach),h=(k.history||[]).slice(-8);return [esc(k.name),(k.source==="complaints_overdue"?v:v+"%"),"Warning "+k.warn+", breach "+k.breach,k.direction==="low_bad"?"Low is bad":"High is bad",spark(h.map(x=>x.v).concat([v])),`<span class="hint">auto: ${k.source}</span>`,rag(st)]}),"No KRIs.");
  else body=T(["Statement",">Value",">Target",">Tolerance",">Limit","Status"],appetiteRows().map(({a,v,st})=>[esc(a.name),v+"%",a.target,a.tolerance,a.limit,st==="red"?`<span class="badge b-cancelled">Breached</span>`:rag(st)]),"No appetite statements.");
  return `<div class="ph"><div><h1>Risk governance</h1><p>ERM register, direction-aware KRIs with real history, and risk appetite.</p></div></div>${mtabs("risk",[["erm","ERM register"],["kri","Key risk indicators"],["app","Risk appetite"]])}${body}`;
}
function spark(vals){if(vals.length<2)return `<span class="hint">No history</span>`;const mn=Math.min(...vals),mx=Math.max(...vals),W=90,H=24,pts=vals.map((v,i)=>`${i/(vals.length-1)*W},${H-2-(mx===mn?0.5:(v-mn)/(mx-mn))*(H-4)}`).join(" ");return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--primary)" stroke-width="1.5"/></svg>`}

function overall(){const s=solv(),br=[];if(s.cov<100)br.push("Net SCR coverage "+Math.round(s.cov*10)/10+"% is below 100%");appetiteRows().filter(x=>x.st==="red").forEach(x=>br.push("Risk appetite breached: "+x.a.name));

      cond:{country:String(fd.get("country")||"")||null,gtype:String(fd.get("gtype")||"")||null,amount_gte:num("amount_gte"),client_exp_gte:num("client_exp_gte"),score_gte:num("score_gte"),group_exp_gte:num("group_exp_gte")}};

  if(t.hasAttribute("data-rerender")){render();const n=document.getElementById(t.id);if(n)n.focus();return}
  if(obj==="newForm"){const c=calcNew(ui.newForm);const el=$("#new-calc");if(el)el.innerHTML=computedHTML(c);const sb=$("#nf-submit");if(sb)sb.disabled=!c.valid}
  if(obj==="endo"){const p=store.policies.find(x=>x.id===ui.endo.pid),el=$("#endo-delta");if(p&&el)el.innerHTML=deltaHTML(endoCalc(p,ui.endo))}
}
document.addEventListener("input",onField);
document.addEventListener("change",e=>{const t=e.target;
  if(t.hasAttribute("data-claimst")){const st=t.value;claimUpdate(t.dataset.id,t.dataset.arg,c=>{c.status=st;if(st==="closed"||st==="rejected")c.reserve=0},"status "+CLAIM_ST[st]);return}
  if(t.hasAttribute("data-ruleactive")){const r=clone(store.rules.find(x=>x.id===t.dataset.id));r.active=t.checked;saveDocC("rules",r).then(()=>toast("Rule "+(r.active?"activated":"deactivated")));return}if(t.id==="doc-file"){uploadDocs(t.dataset.sid,[...t.files]);t.value="";return}if(t.type==="checkbox"&&t.dataset.bind)onField(e)});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#gsearch").focus()}});

/* ---------- Start ---------- */
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(_){}

render();
(async function init(){
  const C=window.claude;let db=null,user=null,dl=null,as=null;
  try{if(C&&C.use)[db,user,dl,as]=await Promise.all([C.use("db"),C.use("user"),C.use("downloads"),C.use("assets")])}catch(_){}
  store.user=user;store.downloads=dl;store.assets=as;
  if(user){try{store.me=await user.id()}catch(_){}try{const w=await user.can("data.write");if(w===false)store.canWrite=false}catch(_){}
    try{const n=await user.name();if(n){$("#me-name").textContent=n;$("#me-ini").textContent=n.trim().charAt(0).toUpperCase()}}catch(_){}
    try{$("#me-role").textContent=(await user.canEdit())?"Administrator":"Underwriter"}catch(_){}}
  if(!db){store.mode="local";render();return}
  store.db=db;store.mode="db";
  const fail=e=>{if(e&&e.code==="revoked")store.canWrite=false;else toast("Lost the database connection. Reload the page.");render()};
  db.collection("parties").onSnapshot(s=>{store.parties=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded.parties=true;scheduleRender()},fail);
  db.collection("policies").onSnapshot(s=>{store.policies=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded.policies=true;scheduleRender()},fail);
  ["links", "treaties", "placements", "statements", "runs", "assumptions", "ifrs", "risks", "kris", "appetite"].forEach(cn=>db.collection(cn).onSnapshot(s=>{store[cn]=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded[cn]=true;scheduleRender()},fail));
  db.collection("complaints").onSnapshot(s=>{store.complaints=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded.complaints=true;scheduleRender()},fail);
  db.collection("rules").onSnapshot(s=>{store.rules=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded.rules=true;scheduleRender()},fail);
  db.collection("submissions").onSnapshot(s=>{store.submissions=s.docs.map(d=>({id:d.id,...d.data()}));store.loaded.submissions=true;scheduleRender()},fail);
  db.doc("settings/general").onSnapshot(s=>{if(s.exists){const d=s.data();store.settings={...store.settings,...d,taxes:{...DEFAULT_TAX,...(d.taxes||{})}}}scheduleRender()},fail);
})();
})();
</script>
</body>
