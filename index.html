<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demos Widigital</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#1a1a1a; --muted:#666; --accent:#0f6cbd; --border:#e3e3e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --card:#1f1f22; --text:#eee; --muted:#a0a0a6; --accent:#4ca3ff; --border:#333338; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 32px 0 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  a.card { display:block; padding:20px; background:var(--card); border:1px solid var(--border); border-radius:10px; text-decoration:none; color:inherit; transition: border-color .15s; }
  a.card:hover { border-color: var(--accent); }
  a.card strong { display:block; margin-bottom:6px; }
  a.card span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Demos Widigital</h1>
  <p class="sub">Prototipos y prueba de concepto para clientes</p>
  <div id="catalogo"></div>
</main>
<script>
  const demos = [
    { cliente: "Ejemplo", titulo: "Demo de prueba", descripcion: "Primer artefacto publicado", ruta: "/ejemplo/demo-prueba/" }
  ];

  const porCliente = demos.reduce((acc, d) => ((acc[d.cliente] ??= []).push(d), acc), {});
  document.getElementById("catalogo").innerHTML = Object.entries(porCliente).map(([cliente, items]) => `
    <h2>${cliente}</h2>
    <div class="grid">
      ${items.map(d => `<a class="card" href="${d.ruta}"><strong>${d.titulo}</strong><span>${d.descripcion}</span></a>`).join("")}
    </div>`).join("");
</script>
</body>
</html>
