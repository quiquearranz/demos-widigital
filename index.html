<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demos Widigital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/wi.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" aria-label="widigital"><svg viewBox="0 0 40 28" aria-hidden="true"><path fill="#E73088" d="M0 0h16L8 14z"/><path fill="#F49C24" d="M22 0h16l-8 14z"/><path fill="#00A3B7" d="M11 26h16L19 11z"/></svg><span><b>wi</b>digital</span></a>
  <small>Demos para clientes</small>
</div></header>

<main class="wrap">
  <section class="intro">
    <h1>Prototipos que se pueden <em>tocar</em></h1>
    <p class="lead">Pruebas de concepto y demos navegables que preparamos para cada cliente. Elige un cliente para ver sus proyectos.</p>
  </section>
  <ul class="list" id="list"></ul>
</main>

<footer class="foot"><div class="wrap"><span>widigital, consultoría tecnológica</span><a href="https://widigital.es">widigital.es</a></div></footer>

<script>
  // Un elemento por carpeta de primer nivel. Para añadir un cliente, añade una entrada aquí.
  const clientes = [
    { nombre: "Barents", ruta: "/barents/", descripcion: "Plataforma de caución y gestión de siniestros.", proyectos: 2 }
  ];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  document.getElementById("list").innerHTML = clientes.map((c, i) => `
    <li><a href="${esc(c.ruta)}">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <div><h2>${esc(c.nombre)}</h2><p>${esc(c.descripcion)} ${c.proyectos} ${c.proyectos === 1 ? "proyecto" : "proyectos"}.</p></div>
      <span class="cta">Ver proyectos<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a></li>`).join("");
</script>
</body>
</html>
